<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema RNC Elgin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .login-box {
            background: #fff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%; 
            max-width: 400px;
        }
        h1 { 
            color: #0056b3; 
            text-align: center; 
            margin-bottom: 30px; 
            font-size: 22px; 
        }
        .form-group { margin-bottom: 20px; }
        label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 8px; 
            font-size: 14px; 
            color: #333; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 15px; 
        }
        input:focus { outline: none; border-color: #0056b3; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #0056b3; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
        }
        button:hover { background: #004494; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .erro { 
            background: #ffebee; 
            color: #c62828; 
            padding: 10px; 
            border-radius: 4px; 
            margin-bottom: 15px; 
            font-size: 14px; 
            display: none; 
        }
        .logo { text-align: center; font-size: 48px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🔒</div>
        <h1>Sistema RNC - Elgin</h1>
        <div id="erro" class="erro"></div>
        <form id="formLogin">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="seu.email@elgin.com">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Digite sua senha">
            </div>
            <button type="submit" id="btnLogin">Entrar</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD0Hgk43ItDuyVRetnkWx7N7XoXStbnDvk",
          authDomain: "rnc-elgin.firebaseapp.com",
          projectId: "rnc-elgin",
          storageBucket: "rnc-elgin.firebasestorage.app",
          messagingSenderId: "75312642711",
          appId: "1:75312642711:web:ae55732315738ca6ac87d2",
          measurementId: "G-3Z7JMC88KM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Se já estiver logado, manda direto pro sistema
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'index.html';
        });

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btnLogin');
            const erroDiv = document.getElementById('erro');
            
            btn.disabled = true;
            btn.innerText = 'Entrando...';
            erroDiv.style.display = 'none';

            try {
                await signInWithEmailAndPassword(auth, email, senha);
                window.location.href = 'index.html';
            } catch (error) {
                erroDiv.style.display = 'block';
                if (error.code === 'auth/invalid-credential') {
                    erroDiv.innerText = 'Email ou senha incorretos';
                } else if (error.code === 'auth/too-many-requests') {
                    erroDiv.innerText = 'Muitas tentativas. Tente mais tarde';
                } else {
                    erroDiv.innerText = 'Erro ao fazer login: ' + error.message;
                }
                btn.disabled = false;
                btn.innerText = 'Entrar';
            }
        });
    </script>
</body>
</html>
