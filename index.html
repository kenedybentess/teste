<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta Elgin - Estoque Pro</title>
    <!-- Importante: CDN para o código de barras -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @media print { .no-print { display: none; } body { padding: 0; background: white; } }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; padding: 20px; gap: 20px; }
        
        /* Painel de Edição */
        .painel { background: white; padding: 20px; border-radius: 8px; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .painel input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        
        /* Layout da Etiqueta (Baseado na imagem_dbdb90.png) */
        .etiqueta { 
            width: 140mm; height: 100mm; background: white; border: 3px solid black;
            display: grid; grid-template-columns: 70px 1fr 110px;
        }

        .elgin-sidebar { 
            border-right: 2px solid black; writing-mode: vertical-rl; 
            transform: rotate(180deg); display: flex; align-items: center; 
            justify-content: center; font-size: 35px; font-weight: 900; 
        }

        .main-content { display: flex; flex-direction: column; }
        .row { border-bottom: 2px solid black; padding: 5px; font-size: 11px; }
        .barcode-section { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 2px solid black; }
        
        .right-sidebar { display: grid; grid-template-rows: 1fr 100px; border-left: 2px solid black; }
        .qc-circle { 
            display: flex; align-items: center; justify-content: center; 
        }
        .circle { 
            border: 2px solid black; border-radius: 50%; width: 70px; height: 70px; 
            text-align: center; display: flex; flex-direction: column; justify-content: center; font-size: 10px;
        }
        .date-section { border-top: 2px solid black; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="painel no-print">
    <h3>Editar Etiqueta</h3>
    <label>Produto:</label>
    <input type="text" id="edit_nome" value="IMPRESSORA TERMICA BEMA MP4200 HS" oninput="atualizar()">
    <label>Cód. Elgin:</label>
    <input type="text" id="edit_elgin" value="46B4200HS001" oninput="atualizar()">
    <label>EAN-13:</label>
    <input type="text" id="edit_ean" value="7908412525957" oninput="atualizar()">
    <label>Responsável:</label>
    <input type="number" id="edit_qc" value="21" oninput="atualizar()">
    <button onclick="window.print()" style="width:100%; padding:10px; background:#28a745; color:white; border:none; border-radius:4px; cursor:pointer;">IMPRIMIR</button>
</div>

<div class="etiqueta">
    <div class="elgin-sidebar">'elgin</div>
    
    <div class="main-content">
        <div class="row"><strong>CNPJ: 14.200.166/0005-90</strong></div>
        <div class="row" style="height: 60px;">
            <b id="txt_nome">IMPRESSORA TERMICA BEMA MP4200 HS</b><br>
            FIRMWARE: 7.010CR2N<br>
            CÓDIGO: <span id="txt_elgin_info">46B4200HS001</span><br>
            QTD: 01 | VOL: 01
        </div>
        <div class="barcode-section">
            <small>CÓDIGO ELGIN</small>
            <svg id="bar_elgin"></svg>
        </div>
        <div class="barcode-section" style="border-bottom: none;">
            <small>CÓDIGO EAN 13</small>
            <svg id="bar_ean"></svg>
        </div>
    </div>

    <div class="right-sidebar">
        <div class="qc-circle">
            <div class="circle">
                CONTROLE<br><b>21</b><br>APROVADO
            </div>
        </div>
        <div class="date-section">
            DATA<br><span id="txt_data">05/05/2026</span>
        </div>
    </div>
</div>

<script>
    function atualizar() {
        // Sincroniza textos
        document.getElementById('txt_nome').innerText = document.getElementById('edit_nome').value;
        document.getElementById('txt_elgin_info').innerText = document.getElementById('edit_elgin.value');
        document.getElementById('txt_data').innerText = new Date().toLocaleDateString('pt-BR');

        // Gera códigos de barras
        JsBarcode("#bar_elgin", document.getElementById('edit_elgin').value, { height: 30, fontSize: 12 });
        JsBarcode("#bar_ean", document.getElementById('edit_ean').value, { format: "EAN13", height: 30, fontSize: 12 });
    }
    atualizar();
</script>

</body>
</html>
