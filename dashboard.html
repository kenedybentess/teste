<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard RNC - Elgin</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; color: #333; }
       .container { max-width: 1600px; margin: 0 auto; }
        h1 { color: #0056b3; margin-bottom: 20px; }
       .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 25px; }
       .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
       .card h3 { font-size: 14px; color: #666; margin-bottom: 8px; }
       .card.valor { font-size: 32px; font-weight: bold; color: #0056b3; }
       .card.aberta.valor { color: #dc3545; }
       .card.fechada.valor { color: #28a745; }
       .graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 20px; margin-bottom: 25px; }
       .grafico-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
       .grafico-box h2 { font-size: 16px; margin-bottom: 15px; color: #333; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 8px; overflow: hidden; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #0056b3; color: white; }
       .status-online { color: #2e7d32; font-weight: bold; float: right; }
        @media (max-width: 768px) {.graficos { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard RNC - Elgin <span class="status-online">● Online - Firebase</span></h1>

        <div class="cards">
            <div class="card">
                <h3>TOTAL RNCs</h3>
                <div class="valor" id="totalRNCs">0</div>
            </div>
            <div class="card aberta">
                <h3>RNCs ABERTAS</h3>
                <div class="valor" id="rncAbertas">0</div>
            </div>
            <div class="card fechada">
                <h3>RNCs FECHADAS</h3>
                <div class="valor" id="rncFechadas">0</div>
            </div>
            <div class="card">
                <h3>PEÇAS REPROVADAS NO MÊS</h3>
                <div class="valor" id="qtdMes">0</div>
            </div>
        </div>

        <div class="graficos">
            <div class="grafico-box">
                <h2>RNC por Origem do Defeito</h2>
                <canvas id="graficoOrigem"></canvas>
            </div>
            <div class="grafico-box">
                <h2>Top 5 Peças com Mais RNCs</h2>
                <canvas id="graficoTopPecas"></canvas>
            </div>
            <div class="grafico-box" style="grid-column: 1 / -1;">
                <h2>RNCs nos Últimos 30 Dias</h2>
                <canvas id="graficoLinha"></canvas>
            </div>
        </div>

        <div class="grafico-box">
            <h2>Últimas RNCs Abertas</h2>
            <table>
                <thead>
                    <tr><th>ID</th><th>Data</th><th>Cód. Peça</th><th>Denominação</th><th>QTD</th><th>Operador</th></tr>
                </thead>
                <tbody id="tabelaAbertas"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD0Hgk43ItDuyVRetnkWx7N7XoXStbnDvk",
          authDomain: "rnc-elgin.firebaseapp.com",
          projectId: "rnc-elgin",
          storageBucket: "rnc-elgin.firebasestorage.app",
          messagingSenderId: "75312642711",
          appId: "1:75312642711:web:ae55732315738ca6ac87d2",
          measurementId: "G-3Z7JMC88KM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function carregarDashboard() {
            const rncsSnapshot = await getDocs(collection(db, "rncs"));
            const rncs = [];
            rncsSnapshot.forEach(doc => rncs.push({id: doc.id,...doc.data()}));

            // 1. Cards
            document.getElementById('totalRNCs').innerText = rncs.length;
            document.getElementById('rncAbertas').innerText = rncs.filter(r => r.status === 'Aberta').length;
            document.getElementById('rncFechadas').innerText = rncs.filter(r => r.status === 'Fechada').length;

            const hoje = new Date();
            const mesAtual = hoje.getMonth();
            const anoAtual = hoje.getFullYear();
            const qtdMes = rncs.filter(r => {
                const dataRNC = new Date(r.data + 'T00:00:00');
                return dataRNC.getMonth() === mesAtual && dataRNC.getFullYear() === anoAtual;
            }).reduce((sum, r) => sum + (r.qtd || 0), 0);
            document.getElementById('qtdMes').innerText = qtdMes;

            // 2. Gráfico Origem
            const origemCount = {};
            rncs.forEach(r => {
                const origem = r.origem_defeito || 'Não informado';
                origemCount[origem] = (origemCount[origem] || 0) + 1;
            });
            new Chart(document.getElementById('graficoOrigem'), {
                type: 'pie',
                data: {
                    labels: Object.keys(origemCount),
                    datasets: [{ data: Object.values(origemCount), backgroundColor: ['#dc3545', '#ffc107', '#17a2b8', '#6c757d'] }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });

            // 3. Top 5 Peças
            const pecasCount = {};
            rncs.forEach(r => {
                const key = `${r.cod_peca} - ${r.denominacao}`;
                pecasCount[key] = (pecasCount[key] || 0) + 1;
            });
            const top5 = Object.entries(pecasCount).sort((a,b) => b[1] - a[1]).slice(0, 5);
            new Chart(document.getElementById('graficoTopPecas'), {
                type: 'bar',
                data: {
                    labels: top5.map(t => t[0].length > 25? t[0].substring(0,25) + '...' : t[0]),
                    datasets: [{ label: 'Qtd RNCs', data: top5.map(t => t[1]), backgroundColor: '#0056b3' }]
                },
                options: { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } } }
            });

            // 4. Gráfico Linha 30 dias
            const ultimos30dias = {};
            for(let i = 29; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const key = d.toISOString().split('T')[0];
                ultimos30dias[key] = 0;
            }
            rncs.forEach(r => {
                if(ultimos30dias.hasOwnProperty(r.data)) ultimos30dias[r.data]++;
            });
            new Chart(document.getElementById('graficoLinha'), {
                type: 'line',
                data: {
                    labels: Object.keys(ultimos30dias).map(d => new Date(d + 'T00:00:00').toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'})),
                    datasets: [{ label: 'RNCs/Dia', data: Object.values(ultimos30dias), borderColor: '#28a745', tension: 0.3, fill: true, backgroundColor: 'rgba(40,167,69,0.1)' }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });

            // 5. Tabela Abertas
            const abertas = rncs.filter(r => r.status === 'Aberta')
                              .sort((a,b) => new Date(b.data) - new Date(a.data))
                              .slice(0, 10);
            const tbody = document.getElementById('tabelaAbertas');
            tbody.innerHTML = abertas.map(r => `
                <tr>
                    <td>${r.id.slice(-6)}</td>
                    <td>${new Date(r.data + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                    <td>${r.cod_peca}</td>
                    <td>${r.denominacao}</td>
                    <td>${r.qtd}</td>
                    <td>${r.visto_operador || '-'}</td>
                </tr>
            `).join('') || '<tr><td colspan="6">Nenhuma RNC aberta</td></tr>';
        }

        carregarDashboard();
    </script>
</body>
</html>
