<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque Pro</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
        }

        body { font-family: sans-serif; background: var(--bg); padding: 20px; color: #1e293b; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        
        h2 { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        
        .form-group { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 20px; align-items: end; }
        
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; }
        .btn-add:hover { background: #1d4ed8; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85em; color: white; }
        .badge-entrada { background: var(--success); }
        .badge-saida { background: var(--danger); }
        
        .summary { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { flex: 1; padding: 15px; border-radius: 8px; border-left: 5px solid var(--primary); background: #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Gestão de Entrada e Saída</h2>

    <div class="summary">
        <div class="card">
            <small>Total em Estoque</small>
            <h3 id="totalEstoque">0</h3>
        </div>
    </div>

    <div class="form-group">
        <div>
            <label>Material</label><br>
            <input type="text" id="material" placeholder="Ex: Cabo de Rede">
        </div>
        <div>
            <label>Quantidade</label><br>
            <input type="number" id="quantidade" min="1" value="1">
        </div>
        <div>
            <label>Tipo</label><br>
            <select id="tipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
            </select>
        </div>
        <button class="btn-add" onclick="registrarMovimentacao()">Registrar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Data/Hora</th>
                <th>Material</th>
                <th>Tipo</th>
                <th>Qtd</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="listaMovimentacoes"></tbody>
    </table>
</div>

<script>
    let estoque = JSON.parse(localStorage.getItem('movimentacoes')) || [];

    function registrarMovimentacao() {
        const material = document.getElementById('material').value;
        const quantidade = parseInt(document.getElementById('quantidade').value);
        const tipo = document.getElementById('tipo').value;
        const data = new Date().toLocaleString('pt-BR');

        if (!material || isNaN(quantidade)) {
            alert("Preencha todos os campos corretamente.");
            return;
        }

        const registro = { id: Date.now(), material, quantidade, tipo, data };
        estoque.push(registro);
        salvarEDesenhar();
        
        document.getElementById('material').value = '';
    }

    function deletar(id) {
        estoque = estoque.filter(item => item.id !== id);
        salvarEDesenhar();
    }

    function salvarEDesenhar() {
        localStorage.setItem('movimentacoes', JSON.stringify(estoque));
        const tbody = document.getElementById('listaMovimentacoes');
        tbody.innerHTML = '';
        
        let total = 0;

        estoque.forEach(item => {
            if (item.tipo === 'entrada') total += item.quantidade;
            else total -= item.quantidade;

            tbody.innerHTML += `
                <tr>
                    <td>${item.data}</td>
                    <td>**${item.material}**</td>
                    <td><span class="badge badge-${item.tipo}">${item.tipo.toUpperCase()}</span></td>
                    <td>${item.quantidade}</td>
                    <td><button onclick="deletar(${item.id})" style="background:none; color:red; cursor:pointer; border:none;">✖</button></td>
                </tr>
            `;
        });

        document.getElementById('totalEstoque').innerText = total;
    }

    // Inicializa a tabela ao carregar
    salvarEDesenhar();
</script>

</body>
</html>
